[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[redirects]]
  from = "/api/armory-sync"
  to = "https://classic-armory.org/api/v1/character/equipment"
  status = 200
  force = true

[[redirects]]
  from = "/api/trigger-sync"
  to = "/.netlify/functions/trigger-sync"
  status = 200
  force = true
