name: Sync Roster and Gear

on:
  workflow_dispatch: # Ermöglicht manuelles Starten per Mausklick auf GitHub
  schedule:
    - cron: '0 3 * * *' # Läuft automatisch jeden Tag um 03:00 Uhr nachts UTC

permissions:
  contents: write # Ermöglicht der Action, Änderungen zurück ins Repo zu pushen

jobs:
  sync-and-build:
    runs-on: windows-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Roster aus Google Sheet importieren
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\0-import-roster.ps1

      - name: Gear aus Armory holen & Plausibilität prüfen
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\2-fetch-gear.ps1

      - name: Prüfen ob genug Spieler abgerufen wurden
        shell: pwsh
        run: |
          $p = Get-Content "daten\players.json" -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($p.Count -lt 5) {
            Write-Output "FEHLER: players.json hat nur $($p.Count) Einträge. Abbruch."
            exit 1
          }
          Write-Output "OK: $($p.Count) Spieler in players.json."

      # Python wird von 7-stat-gewichte.py und 6-trinket-sim.py gebraucht.
      # windows-latest bringt es zwar mit, aber ausdruecklich ist verlaesslicher.
      - name: Python bereitstellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: WoWSims Stat-Gewichte simulieren (alle DPS-Spieler)
        shell: pwsh
        run: |
          python 7-stat-gewichte.py

      # Bewusst NICHT im Nachtlauf: 6-trinket-sim.py braucht rund 49 Sekunden je Spieler
      # (gut 15 Minuten fuer den Kader) und die gemessenen Werte aendern sich nur, wenn sich das
      # uebrige Gear eines Spielers spuerbar aendert. Der Lauf wird daher von Hand angestossen:
      #   python 6-trinket-sim.py
      # Die Ergebnisse liegen in daten/trinket-werte.json und werden hier nur mitcommittet.

      # Alle drei Phasen rechnen. Sobald upgrades-p4/p5.json einmal im Repo liegen,
      # nimmt 5-build-payload sie in die Nutzlast auf - wuerden sie hier nicht
      # mitgerechnet, zeigte die Seite fuer Phase 4 und 5 dauerhaft den Gear-Stand
      # vom Tag ihrer Erzeugung, waehrend Phase 3 taeglich frisch ist. Genau diese
      # stille Vermischung von altem und neuem Stand soll nicht passieren.
      - name: Upgrades berechnen & Webseiten bauen
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\3-compute.ps1
          powershell -ExecutionPolicy Bypass -File .\3-compute.ps1 -Phase 4
          powershell -ExecutionPolicy Bypass -File .\3-compute.ps1 -Phase 5
          powershell -ExecutionPolicy Bypass -File .\4-bis-check.ps1
          powershell -ExecutionPolicy Bypass -File .\5-build-payload.ps1

      - name: Änderungen committen und pushen
        run: |
          git config --global user.name "GitHub Action (Auto-Sync)"
          git config --global user.email "action@github.com"
          git add roster.json daten/players.json daten/cache-tooltips.json daten/payload.json index.html ausgabe/loot-prio-p3.html daten/bis-listen-phasen.json daten/sim-weights.json daten/trinket-werte.json daten/upgrades-p4.json daten/upgrades-p5.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-sync roster and gear [skip ci]" && git push)
